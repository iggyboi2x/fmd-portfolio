<!doctype html>
<!--
  Source for public/og-image.png (the link-preview card shown on LinkedIn,
  Messenger, X, Slack). Regenerate after editing:

  "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless --disable-gpu \
    --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
    --screenshot=public/og-image.png scripts/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@600;700&family=JetBrains+Mono:wght@500;700&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #14140f; color: #f6efdf;
    font-family: 'Archivo', Arial, sans-serif;
  }
  .bars { position: absolute; top: 0; right: 0; bottom: 0; width: 170px; display: flex; }
  .bars span { flex: 1; }
  .glare { position: absolute; bottom: -140px; left: -60px; width: 380px; height: 380px;
           border-radius: 50%; background: #f5b324; filter: blur(70px); opacity: 0.22; }
  .lane { position: absolute; left: 0; right: 0; bottom: 34px; height: 6px;
          background-image: repeating-linear-gradient(90deg, #f5b324 0 44px, transparent 44px 78px); }
  .inner { position: absolute; left: 72px; top: 62px; right: 240px; }
  .status { display: inline-flex; align-items: center; gap: 12px; background: #f6efdf; color: #14140f;
            border: 4px solid #14140f; box-shadow: 6px 6px 0 #000; border-radius: 10px;
            padding: 10px 18px; font-weight: 700; font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase; }
  .status i { width: 12px; height: 12px; border-radius: 50%; background: #1c8f4e; }
  h1 { font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 132px; line-height: 0.98;
       margin: 34px 0 30px; }
  h1 span { display: block; }
  h1 .accent { color: #f5b324; }
  .role { font-size: 30px; font-weight: 700; }
  .url { margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 22px; color: #9aa0ac; }
</style>
</head>
<body>
  <div class="bars"><span style="background:#e2412a"></span><span style="background:#2447c4"></span><span style="background:#1c8f4e"></span></div>
  <div class="glare"></div>
  <div class="lane"></div>
  <div class="inner">
    <div class="status"><i></i>Open to work — internships &amp; freelance</div>
    <h1><span>FRANCIS</span><span class="accent">MIGUEL.</span></h1>
    <p class="role">Full-stack engineer · Cebu, PH</p>
    <p class="url">francismigueldiano.vercel.app</p>
  </div>
</body>
</html>
